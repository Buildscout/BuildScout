name: BuildScout regression checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          set -e
          for file in *.js api/*.js; do
            [ -f "$file" ] && node --check "$file"
          done

      - name: Run UI/backend contract checks
        run: node scripts/regression-check.js
